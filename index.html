<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff">
  <meta name="description" content="自由に走ろう、つながる道。Ride Link">
  <title>Ride Link</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/css/styles.css?v=phase4-analysis-label-fix">
</head>
<body>
<div class="app">
  <header class="header">
    <button class="header-btn hamburger" type="button" aria-label="メニュー"><i></i><i></i><i></i></button>
    <a class="logo" href="#"><span class="mountain">⌁</span><b>Ride Link</b><small>自由に走ろう、つながる道。</small></a>
    <button class="header-btn profile" type="button" aria-label="プロフィール"><i></i></button>
  </header>
  <main>
    <section class="radar card" aria-labelledby="map-title">
      <div class="card-head">
        <h1 id="map-title">雨雲レーダー <small>（過去60分〜未来60分）</small></h1>
        <span class="map-live"><i></i> MAP</span>
      </div>
      <div class="map" aria-label="現在地を表示する地図">
        <div id="leaflet-map"></div>
        <div class="map-analysis-time" aria-label="雨雲の最新解析時刻">最新解析 <strong id="analysis-time">--:--</strong></div>
        <div class="map-actions" aria-label="地図操作">
          <button id="locate-button" type="button" aria-label="現在地へ戻る"><span class="target-icon"></span><small>現在地</small></button>
          <button id="heading-button" type="button" aria-label="ヘディングアップへ切り替え" aria-pressed="false"><span class="compass-icon">N</span><small>北固定</small></button>
        </div>
      </div>
      <div class="location">
        <span class="pin"></span>
        <p><small>現在地・進行方向</small><strong id="location-status" role="status" aria-live="polite">位置情報を確認しています…</strong><span id="heading-status" class="heading-status" role="status" aria-live="polite">進行方向ボタンで方位を表示できます</span></p>
      </div>
      <div class="timeline-box">
        <div class="clock"><em id="rain-status" role="status" aria-live="polite">雨雲を確認しています…</em></div>
        <div class="timeline-row">
          <button id="play-button" class="play-button" type="button" aria-label="タイムラインを再生" aria-pressed="false"><span></span></button>
          <div id="timeline" class="timeline" aria-label="過去60分から未来60分までの雨雲タイムライン" tabindex="0"></div>
        </div>
        <div class="rain-key" aria-label="タイムラインの区分"><span class="observed-key">観測</span><span class="analysis-key">最新解析</span><span class="forecast-key">予測</span></div>
        <p class="weather-attribution">雨雲データ：<a href="https://www.jma.go.jp/bosai/rain/" target="_blank" rel="noopener">気象庁「雨雲の動き」</a>をもとに表示</p>
      </div>
    </section>
    <section class="home-actions" aria-label="ツーリングメニュー">
      <a class="primary-cta" href="#create"><span class="cta-plus">＋</span><span><strong>ツーリングを作成</strong><small>ルートと予定をまとめる</small></span><b>›</b></a>
      <a class="saved-cta" id="saved" href="#saved-list"><span class="saved-icon">▤</span><span><strong>保存したツーリング</strong><small>作成済みのプランを確認</small></span><b>›</b></a>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <a class="active" href="#" aria-current="page"><span class="home-icon"></span><small>ホーム</small></a>
    <a href="#create"><span class="nav-route"></span><small>ツーリング作成</small></a>
    <a href="#saved"><span class="nav-list">☷</span><small>保存リスト</small></a>
  </nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.3/dist/leaflet-rotate.umd.min.js"></script>
<script src="assets/js/jma-rain-provider.js?v=phase4-heading-up" defer></script>
<script src="assets/js/app.js?v=phase4-heading-up" defer></script>
</body>
</html>
